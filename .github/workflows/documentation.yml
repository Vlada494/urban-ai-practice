name: Sphinx documentation (manual)

# The homework dashboard is published from main /docs via GitHub Pages.
# Keep the inherited Sphinx documentation available as a manual build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[docs]'
      - name: Sphinx build
        run: |
          sphinx-build docs/source docs/build
